    <script>
      // Apply the stored or system theme before first paint (no flash).
      (function () {
        try {
          var s = localStorage.getItem("r4-theme");
          var t = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
          if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#020d09");
        } catch (e) {}
      })();
    </script>
